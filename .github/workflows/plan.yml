name: Planning contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No install needed: these bootstrap checks use only Node built-ins.
      - run: node --test scripts/plan.test.mjs
      - run: node scripts/plan.mjs check
      - run: node scripts/plan.mjs status
