name: Pinned TrailBase foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Verify official artifact before execution on actual Linux x86_64
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          node scripts/setup-trailbase.mjs
          echo "$PWD/.local/tools/trailbase-v0.33.14-linux-x64" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:bootstrap
      - run: pnpm check && pnpm lint && pnpm test:unit && pnpm build
      - run: pnpm test:backend -- capabilities
      - run: pnpm test:scaffold && pnpm plan:check && pnpm plan:status && pnpm test:plan
      # No raw backend artifacts: startup logs may contain generated admin credentials.
      # P01 browser shell is verified locally with installed Chrome; pinned-browser CI is P04.
      # Linux cannot establish native macOS C4 or Android TV acceptance.
